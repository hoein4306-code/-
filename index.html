<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>دفتر کار</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: #f4f7fc; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; width: 100%; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header button { background: #007bff; color: white; border: none; border-radius: 10px; padding: 8px 15px; font-size: 18px; cursor: pointer; }
        .month-year { font-size: 22px; font-weight: bold; color: #333; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #555; margin-bottom: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-cell { background: #f8f9fa; border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .day-cell:hover { background: #e9ecef; transform: scale(1.05); }
        .day-cell.has-record { background: #d4edda; border-color: #28a745; font-weight: bold; }
        .day-cell.off-day { background: #f8d7da; border-color: #dc3545; }
        .day-cell.empty { background: transparent; cursor: default; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; }
        .modal-content h3 { margin-top: 0; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 10px; font-size: 14px; }
        .input-group textarea { height: 60px; resize: vertical; }
        .btn-save { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-close { background: #6c757d; color: white; border: none; padding: 8px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 5px; }
        .stats-section { margin-top: 25px; background: #e8f0fe; padding: 15px; border-radius: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: white; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-box .num { font-size: 22px; font-weight: bold; color: #007bff; }
        .stat-box .label { font-size: 12px; color: #555; }
        .settlement-btn { background: #dc3545; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .list-records { margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .list-item { background: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; border-right: 4px solid #007bff; font-size: 13px; }
        .toast { background: #28a745; color: white; padding: 10px; border-radius: 10px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <button onclick="changeMonth(-1)">◀</button>
        <span class="month-year" id="displayMonthYear"></span>
        <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="weekdays">
        <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
    </div>
    <div class="days-grid" id="daysContainer"></div>

    <!-- مودال -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">تاریخ</h3>
            <div class="input-group">
                <label>ورود (ساعت)</label>
                <input type="time" id="entryTime">
            </div>
            <div class="input-group">
                <label>خروج (ساعت)</label>
                <input type="time" id="exitTime">
            </div>
            <div class="input-group">
                <label>وضعیت</label>
                <select id="statusSelect">
                    <option value="present">حضور</option>
                    <option value="holiday">تعطیلی</option>
                    <option value="leave">مرخصی</option>
                </select>
            </div>
            <div class="input-group">
                <label>گزارش کار / توضیحات</label>
                <textarea id="reportText" placeholder="مثلاً: تسویه‌حساب، پروژه X..."></textarea>
            </div>
            <button class="btn-save" onclick="saveRecord()">💾 ذخیره</button>
            <button class="btn-close" onclick="closeModal()">بستن</button>
        </div>
    </div>

    <!-- بخش آمار و دکمه‌ها -->
    <div class="stats-section">
        <div class="stats-grid">
            <div class="stat-box"><div class="num" id="totalDays">0</div><div class="label">روزهای کاری</div></div>
            <div class="stat-box"><div class="num" id="totalHours">0</div><div class="label">مجموع ساعت‌ها</div></div>
            <div class="stat-box"><div class="num" id="totalHolidays">0</div><div class="label">تعطیلی</div></div>
            <div class="stat-box"><div class="num" id="totalLeaves">0</div><div class="label">مرخصی</div></div>
        </div>

        <div id="toastMessage" class="toast"></div>

        <button class="settlement-btn" onclick="settleAll()">🧹 تسویه (پاک کردن همه)</button>
        
        <div style="margin-top:15px; font-weight:bold; font-size:14px;">گزارش روزهای ثبت‌شده:</div>
        <div class="list-records" id="recordsList">
            <div style="color:#888; text-align:center; padding:10px;">روزی را انتخاب کنید...</div>
        </div>
    </div>
</div>



<script>
    // ---------- متغیرهای تقویم ----------
    let currentYear = 1405;
    let currentMonth = 1;

    // ---------- توابع کمکی ----------
    function getDaysInMonth(year, month) {
        if (month <= 6) return 31;
        if (month <= 11) return 30;
        const isLeap = (year % 33 === 1 || year % 33 === 5 || year % 33 === 9 || year % 33 === 13 || year % 33 === 17 || year % 33 === 22 || year % 33 === 26 || year % 33 === 30);
        return isLeap ? 30 : 29;
    }

    function getFirstDayOfMonth(year, month) {
        const baseMiladi = new Date(1921, 2, 21);
        let diffDays = 0;
        for (let y = 1300; y < year; y++) {
            for (let m = 1; m <= 12; m++) diffDays += getDaysInMonth(y, m);
        }
        for (let m = 1; m < month; m++) diffDays += getDaysInMonth(year, m);
        const targetDate = new Date(baseMiladi);
        targetDate.setDate(targetDate.getDate() + diffDays);
        return targetDate.getDay(); 
    }

    function getData() {
        return JSON.parse(localStorage.getItem('work_calendar_data') || '{}');
    }

    function setData(data) {
        localStorage.setItem('work_calendar_data', JSON.stringify(data));
    }

    // ---------- رندر تقویم ----------
    function renderCalendar() {
        const container = document.getElementById('daysContainer');
        container.innerHTML = '';
        document.getElementById('displayMonthYear').innerText = `${currentMonth} / ${currentYear}`;
        
        const daysCount = getDaysInMonth(currentYear, currentMonth);
        const firstDay = getFirstDayOfMonth(currentYear, currentMonth);
        let startOffset = (firstDay + 1) % 7;

        for (let i = 0; i < startOffset; i++) {
            const div = document.createElement('div');
            div.className = 'day-cell empty';
            container.appendChild(div);
        }

        const data = getData();
        for (let d = 1; d <= daysCount; d++) {
            const div = document.createElement('div');
            div.className = 'day-cell';
            const dateKey = `${currentYear}/${String(currentMonth).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
            div.innerText = d;
            
            if (data[dateKey]) {
                if (data[dateKey].status === 'holiday' || data[dateKey].status === 'leave') {
                    div.classList.add('off-day');
                } else {
                    div.classList.add('has-record');
                }
            }
            div.onclick = () => openModal(dateKey, d);
            container.appendChild(div);
        }
        updateStats();
    }

    // ---------- مودال ----------
    let currentDateKey = '';

    function openModal(dateKey, day) {
        currentDateKey = dateKey;
        document.getElementById('modalDateTitle').innerText = `📅 ${dateKey}`;
        const data = getData();
        const record = data[dateKey] || {};
        document.getElementById('entryTime').value = record.entry || '';
        document.getElementById('exitTime').value = record.exit || '';
        document.getElementById('statusSelect').value = record.status || 'present';
        document.getElementById('reportText').value = record.report || '';
        document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('eventModal').style.display = 'none';
    }

    function saveRecord() {
        const data = getData();
        data[currentDateKey] = {
            entry: document.getElementById('entryTime').value,
            exit: document.getElementById('exitTime').value,
            status: document.getElementById('statusSelect').value,
            report: document.getElementById('reportText').value
        };
        setData(data);
        closeModal();
        renderCalendar();
        showToast('✅ ذخیره شد.');
    }

    // ---------- تغییر ماه ----------
    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth > 12) { currentMonth = 1; currentYear++; }
        if (currentMonth < 1) { currentMonth = 12; currentYear--; }
        if (currentYear < 1380) currentYear = 1380;
        if (currentYear > 1420) currentYear = 1420;
        renderCalendar();
    }

    // ---------- آمار ----------
    function updateStats() {
        const data = getData();
        let totalDays = 0, totalHours = 0, holidays = 0, leaves = 0;
        let listHtml = '';

        const keys = Object.keys(data).sort();
        for (let key of keys) {
            const rec = data[key];
            const status = rec.status || 'present';
            if (status === 'present') {
                totalDays++;
                if (rec.entry && rec.exit) {
                    const [h1, m1] = rec.entry.split(':').map(Number);
                    const [h2, m2] = rec.exit.split(':').map(Number);
                    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
                    if (diff < 0) diff += 1440;
                    totalHours += diff / 60;
                }
                listHtml += `<div class="list-item"><span>✅ ${key}</span><span>${rec.entry || '--'} تا ${rec.exit || '--'}</span></div>`;
            } else if (status === 'holiday') {
                holidays++;
                listHtml += `<div class="list-item" style="border-right-color:#dc3545;"><span>🏖️ ${key}</span><span>تعطیلی</span></div>`;
            } else if (status === 'leave') {
                leaves++;
                listHtml += `<div class="list-item" style="border-right-color:#ffc107;"><span>🏠 ${key}</span><span>مرخصی</span></div>`;
            }
        }

        document.getElementById('totalDays').innerText = totalDays;
        document.getElementById('totalHours').innerText = totalHours.toFixed(1);
        document.getElementById('totalHolidays').innerText = holidays;
        document.getElementById('totalLeaves').innerText = leaves;
        document.getElementById('recordsList').innerHTML = listHtml || '<div style="color:#888;text-align:center;padding:10px;">هیچ رکوردی ثبت نشده</div>';
    }

    // ---------- تسویه ----------
    function settleAll() {
        if (confirm('⚠️ آیا مطمئنی که همه‌ی داده‌ها پاک شوند؟ (تسویه حساب)')) {
            if (confirm('پاک کردن نهایی! باز هم تأیید می‌کنی؟')) {
                setData({});
                renderCalendar();
                showToast('🧹 همه چیز پاک شد.');
            }
        }
    }

    // ---------- Toast ----------
    function showToast(msg) {
        const el = document.getElementById('toastMessage');
        el.style.display = 'block';
        el.innerText = msg;
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // ---------- شروع اولیه ----------
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('fa-IR', { calendar: 'persian', year: 'numeric', month: 'numeric' });
    const parts = formatter.formatToParts(now);
    let sy = 1405, sm = 1;
    for (let p of parts) {
        if (p.type === 'year') sy = parseInt(p.value);
        if (p.type === 'month') sm = parseInt(p.value);
    }
    if (sy >= 1380 && sy <= 1420) { currentYear = sy; currentMonth = sm; }
    renderCalendar();

    window.onclick = function(e) {
        const modal = document.getElementById('eventModal');
        if (e.target === modal) closeModal();
    }

    // ---------- ثبت Service Worker برای نصب به‌صورت اپ ----------
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        });
    }
</script>
</body>
</html>
